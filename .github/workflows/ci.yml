name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override target-cpu=native so cached artifacts work across runner CPUs.
  RUSTFLAGS: ""
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: just fmt-check
      - name: Check isolated Stable feature sets and consumers
        run: just ci-stable-check
      - name: Lint Stable targets
        run: just ci-stable-lint
      - name: Run Stable tests and doctests
        run: just ci-stable-test

  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: Check minimal SIMD builds
        run: just ci-nightly-check
      - name: Lint and test all Nightly features
        run: just simd
      - name: Build strict all-feature Rustdoc
        run: just ci-nightly-doc
