name: Clippy timings

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/ci-timings.yml]

permissions:
  contents: read

env:
  RUSTFLAGS: ""
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  measure:
    name: ${{ matrix.toolchain }} paired Clippy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Prepare the regular pre-Clippy build
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          git rev-parse HEAD
          rustc -vV
          lscpu | awk '/^Architecture:|^CPU\(s\):|^Model name:/'
          just "ci-$TOOLCHAIN-check"
          mv target "$RUNNER_TEMP/pre-clippy-target"
      - name: Time both Clippy scopes twice on the same runner
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          for scope in '--all-targets' '--lib --tests' '--lib --tests' '--all-targets'; do
            # Reuse the same starting point at the same path for every measurement.
            cp -a --reflink=auto "$RUNNER_TEMP/pre-clippy-target" target
            printf '\nClippy scope %s\n' "$scope"
            if [[ "$TOOLCHAIN" == stable ]]; then
              time just ci-stable-lint "$scope"
            else
              time just simd-lint '*' "$scope"
            fi
            rm -rf -- target
          done
