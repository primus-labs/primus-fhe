[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
dashu-float = "0.6.1"
dashu-int = "0.6.1"
num-complex = "0.4"
num-traits = "0.2"
rand = "0.10.3"
rustfft = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"
bytemuck = "1.25.0"
pastey = "0.2.3"
thiserror = "2"
itertools = "0.15.0"
rayon = "1.12"

criterion = "0.8"
comfy-table = "8.0"

[profile.dev]
opt-level = 1
