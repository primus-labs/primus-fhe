[package]
name = "primus_tfhe_ntru_ntt"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_shape = { path = "../primus_shape" }
primus_lwe = { path = "../primus_lwe" }
primus_encoding = { path = "../primus_encoding" }
primus_decompose = { path = "../primus_decompose" }
primus_data = { path = "../primus_data" }
primus_integer = { path = "../primus_integer" }
primus_lattice = { path = "../primus_lattice", features = ["ntt"] }
primus_modulus = { path = "../primus_modulus" }
primus_ntru = { path = "../primus_ntru", features = ["ntt"] }
primus_ntt = { path = "../primus_ntt" }
primus_reduce = { path = "../primus_reduce" }
primus_poly = { path = "../primus_poly" }
primus_tfhe = { path = "../primus_tfhe" }
primus_tfhe_ntru = { path = "../primus_tfhe_ntru" }

num-traits = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "pbs"
harness = false

[[bench]]
name = "many_lut"
harness = false

[[bench]]
name = "mvb"
harness = false

[[bench]]
name = "cbs"
harness = false

[[bench]]
name = "one_hot"
harness = false

[features]
default = []
simd = [
    "primus_integer/simd",
    "primus_lattice/simd",
    "primus_ntru/simd",
    "primus_ntt/simd",
    "primus_tfhe_ntru/simd",
]
