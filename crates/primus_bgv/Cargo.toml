[package]
name = "primus_bgv"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_data = { path = "../primus_data" }
primus_decompose = { path = "../primus_decompose" }
primus_distr = { path = "../primus_distr" }
primus_encoding = { path = "../primus_encoding" }
primus_factor = { path = "../primus_factor" }
primus_glwe_rns = { path = "../primus_glwe_rns" }
primus_integer = { path = "../primus_integer" }
primus_lattice = { path = "../primus_lattice", features = ["rns"] }
primus_modulus = { path = "../primus_modulus" }
primus_ntt = { path = "../primus_ntt" }
primus_poly = { path = "../primus_poly" }
primus_reduce = { path = "../primus_reduce" }
primus_rns = { path = "../primus_rns" }
primus_shape = { path = "../primus_shape" }
rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
dashu-int = { workspace = true }

[features]
default = []
parallel = ["primus_ntt/parallel", "primus_glwe_rns/parallel", "primus_lattice/parallel"]
batching = ["primus_encoding/batching"]
simd = ["primus_glwe_rns/simd", "primus_encoding/simd"]

[[example]]
name = "slots"
required-features = ["batching"]

[[bench]]
name = "workflow"
harness = false
required-features = ["batching"]

[[example]]
name = "leveled_slots"
required-features = ["batching"]

[[bench]]
name = "leveled"
harness = false
required-features = ["batching"]
