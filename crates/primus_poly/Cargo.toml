[package]
name = "primus_poly"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_shape = { path = "../primus_shape" }
primus_data = { path = "../primus_data" }
primus_integer = { path = "../primus_integer" }
primus_reduce = { path = "../primus_reduce" }
primus_modulus = { path = "../primus_modulus" }
primus_factor = { path = "../primus_factor" }

num-traits = { workspace = true }
rand = { workspace = true }
itertools = { workspace = true }
pastey = { workspace = true }
num-complex = { workspace = true }

[features]
default = []
simd = ["primus_integer/simd", "primus_modulus/simd", "primus_factor/simd"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "butterfly"
harness = false

[[bench]]
name = "fourier"
harness = false

[[bench]]
name = "monomial"
harness = false
