[package]
name = "primus_ntt"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_integer = { path = "../primus_integer" }
primus_reduce = { path = "../primus_reduce" }
primus_modulus = { path = "../primus_modulus" }
primus_factor = { path = "../primus_factor" }
primus_shape = { path = "../primus_shape" }
primus_gcd = { path = "../primus_gcd" }

thiserror = { workspace = true }
rand = { workspace = true }
aligned-vec = "0.6.4"
num-traits = { workspace = true }

[dev-dependencies]
primus_poly = { path = "../primus_poly" }
criterion = { workspace = true }

[features]
default = []
simd = [
    "primus_integer/simd",
    "primus_modulus/simd",
    "primus_factor/simd",
]

[[bench]]
name = "bench_ntt"
harness = false
