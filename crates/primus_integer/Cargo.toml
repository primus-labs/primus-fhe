[package]
name = "primus_integer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/primus-labs/primus-fhe"

[dependencies]
primus_data = { path = "../primus_data" }
primus_gcd = { path = "../primus_gcd" }

num-traits = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, optional = true }
zeroize = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
serde = ["dep:serde"]
simd = []

[[test]]
name = "serde"
required-features = ["serde"]

[[bench]]
name = "word_ops"
harness = false

[[bench]]
name = "big_uint"
harness = false

[[bench]]
name = "div_rem_scalar"
harness = false
