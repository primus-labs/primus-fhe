[package]
name = "primus_modulus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/primus-labs/primus-fhe"

[dependencies]
primus_gcd = { path = "../primus_gcd" }
primus_integer = { path = "../primus_integer" }
primus_reduce = { path = "../primus_reduce" }
primus_barrett_derive = { path = "../primus_barrett_derive", optional = true }
num-traits = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }

[[test]]
name = "derives"
required-features = ["derive"]

[[bench]]
name = "scalar_moduli"
harness = false

[[bench]]
name = "barrett_scalar"
harness = false

[[bench]]
name = "slice_moduli"
harness = false

[[bench]]
name = "barrett_slice"
harness = false

[[bench]]
name = "derived_mac"
harness = false
required-features = ["derive"]

[features]
default = []
derive = ["dep:primus_barrett_derive"]
simd = ["primus_integer/simd", "primus_barrett_derive?/simd"]

[[bench]]
name = "slice_arithmetic"
harness = false

[[bench]]
name = "signed_encoding"
harness = false

[[bench]]
name = "signed_dot_product"
harness = false

[[bench]]
name = "modulus_switch"
harness = false
