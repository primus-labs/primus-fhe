[package]
name = "primus_rns"
version = "0.1.0"
edition = "2024"

[dependencies]
primus_data = { path = "../primus_data" }
primus_integer = { path = "../primus_integer" }
primus_reduce = { path = "../primus_reduce" }
primus_modulus = { path = "../primus_modulus" }
primus_factor = { path = "../primus_factor" }

thiserror = { workspace = true }
itertools = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
default = []
simd = [
    "primus_integer/simd",
    "primus_modulus/simd",
    "primus_factor/simd",
]

[[bench]]
name = "decompose"
harness = false
